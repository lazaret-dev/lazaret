# Tests both packages on every push to main or next (the branch the work in progress shares) and every PR.
# Also called by release.yml before publishing.
# Everything runs on stock interpreters: nothing is pip- or npm-installed.
# All third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check-versions.sh

  # Unit, adversarial, compatibility, architecture and build tests, on the
  # native engine: since the Rust-first refactor it is the Python package's
  # only engine, so each job builds it (the runner's Rust; the build needs no
  # registry: Cargo.lock lists only the workspace) and proves it loads before
  # the suite runs, since the engine's own tests skip without it. Tests that
  # need Postgres skip themselves here (LAZARET_TEST_PG_DSN is unset).
  python-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: The native engine
        working-directory: rust
        run: cargo build --release --offline --locked
      - working-directory: python
        shell: bash
        run: |
          LAZARET_NATIVE_LIB=$(PYTHONPATH=src python -c 'import os; from lazaret.scanner import _native; print(os.path.abspath(os.path.join("..", "rust", "target", "release", _native.library_name())))')
          export LAZARET_NATIVE_LIB
          PYTHONPATH=src python -c "from lazaret.scanner import _native; assert _native.available(), _native.load_error(); print('native engine', _native.version())"
          python -m unittest discover -s tests -t . -v

  # Live Postgres. The password only exists inside this job's throwaway
  # container, so it is not a secret.
  python-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest (the multi-arch index of postgres:17 = 17.11). Resolved
        # 2026-09-25 from docker-library/repo-info (repos/postgres/remote/17.md),
        # which mirrors Docker Hub; Docker Hub itself was not reachable from the
        # machine that made this change. Verify or update with:
        #   docker buildx imagetools inspect postgres:17
        # Dependabot does not update service images: bump this by hand.
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: lazaret-ci
          POSTGRES_DB: lazaret_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      LAZARET_TEST_PG_DSN: postgresql://postgres:lazaret-ci@127.0.0.1:5432/lazaret_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The native engine
        working-directory: rust
        run: cargo build --release --offline --locked
      - working-directory: python
        shell: bash
        run: |
          LAZARET_NATIVE_LIB=$(PYTHONPATH=src python -c 'import os; from lazaret.scanner import _native; print(os.path.abspath(os.path.join("..", "rust", "target", "release", _native.library_name())))')
          export LAZARET_NATIVE_LIB
          PYTHONPATH=src python -c "from lazaret.scanner import _native; assert _native.available(), _native.load_error(); print('native engine', _native.version())"
          python -m unittest tests.pg.test_integration tests.registry.test_pg_backend -v

  # The npm package runs the native engine as WebAssembly (js/native/lazaret.wasm,
  # docs/RUST_ENGINE.md): built first, with the runner's Rust and its wasm32
  # target (release.yml builds the published one with the pinned toolchain).
  # Then, once per OS, the npm package against the Python package, both on
  # the engine: the test_js_parity modules skip where the WebAssembly build or
  # the native library is missing, so the step asserts that both load first.
  js:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: rustup target add wasm32-unknown-unknown
      - working-directory: js
        run: npm run build
      - working-directory: js
        run: npm test
      - if: matrix.node == '24'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The native engine
        if: matrix.node == '24'
        working-directory: rust
        run: cargo build --release --offline --locked
      - name: The npm package against the Python package
        if: matrix.node == '24'
        working-directory: python
        shell: bash
        run: |
          LAZARET_NATIVE_LIB=$(PYTHONPATH=src python -c 'import os; from lazaret.scanner import _native; print(os.path.abspath(os.path.join("..", "rust", "target", "release", _native.library_name())))')
          export LAZARET_NATIVE_LIB
          PYTHONPATH=src python -c "from lazaret.scanner import _native; assert _native.available(), _native.load_error(); print('native engine', _native.version())"
          node -e 'import("../js/src/lib/native.js").then((n) => { if (!n.available()) process.exit(1); console.log("npm engine", n.call("version").version); })'
          python -m unittest tests.architecture.test_js_parity tests.architecture.test_js_parity_config \
            tests.architecture.test_js_parity_core \
            tests.architecture.test_js_parity_eval tests.architecture.test_js_parity_flow \
            tests.architecture.test_js_parity_ci_hardening tests.architecture.test_js_parity_go_rust \
            tests.architecture.test_js_parity_gyp tests.architecture.test_js_parity_lexing \
            tests.architecture.test_js_parity_limits tests.architecture.test_js_parity_lookalike \
            tests.architecture.test_js_parity_persistence tests.architecture.test_js_parity_taint \
            tests.architecture.test_js_parity_verify \
            tests.architecture.test_js_parity_tokens \
            tests.architecture.test_review_final_parity tests.architecture.test_notices -v

  # The native engine (rust/, docs/RUST_ENGINE.md): no external crates, its
  # rule pack in its canonical form and consistent with the values core still
  # keeps, its own tests, and its WebAssembly build against the library (the
  # Python suite runs on the library in python-unit). The network layer
  # (lazaret-net) and tiny_https, the library it is built on, are tested here
  # too. Rust is on the runners already (1.87 or later); the build needs no
  # registry (Cargo.lock lists only the workspace). Python 3.10 because
  # make_rust_tables.py --check compares the generated Unicode 13.0 tables
  # with 3.10's unicodedata.
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python scripts/check_rust_deps.py
      # tiny_https (NET-1) is in rust/crates as it was handed over: no file changed since it was taken
      - run: python scripts/sync_tiny_https.py --verify
      - run: python scripts/make_rust_tables.py --check
      - working-directory: rust
        run: cargo test --release --offline --locked
      # tiny_https's own tests, those that need nothing installed (its interop tests want OpenSSL, Go or
      # aioquic servers and are the library's to run)
      - working-directory: rust
        run: >-
          cargo test --release --offline --locked -p tiny_https --lib --test go_vectors --test cms_vectors
          --test sigstore_real --test sigstore_synthetic --test rekor_real --test real_chains --test inflate_vectors
      - working-directory: rust
        run: cargo build --release --offline --locked
      # The WebAssembly build (the npm package's engine) against this library:
      # the same answers for every case of the corpora. Node is on the runners.
      - run: rustup target add wasm32-unknown-unknown
      - working-directory: js
        run: npm run build
      - name: The WebAssembly build against the native library
        working-directory: python
        shell: bash
        run: |
          LAZARET_NATIVE_LIB=$(PYTHONPATH=src python -c 'import os; from lazaret.scanner import _native; print(os.path.abspath(os.path.join("..", "rust", "target", "release", _native.library_name())))')
          export LAZARET_NATIVE_LIB
          PYTHONPATH=src python -c "from lazaret.scanner import _native; assert _native.available(), _native.load_error()"
          node -e 'import("../js/src/lib/native.js").then((n) => { if (!n.available()) process.exit(1); console.log("npm engine", n.call("version").version); })'
          python -m unittest tests.architecture.test_wasm_parity tests.architecture.test_wasm_parity_signs \
            tests.architecture.test_wasm_parity_crossfile tests.architecture.test_wasm_parity_jsparse \
            tests.architecture.test_wasm_parity_jsflow tests.architecture.test_wasm_parity_pyparse \
            tests.architecture.test_wasm_parity_pyflow tests.architecture.test_wasm_parity_project \
            tests.architecture.test_wasm_parity_secrets -v
