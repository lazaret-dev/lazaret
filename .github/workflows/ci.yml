# Tests both packages on every push and PR. Also called by release.yml before publishing.
# Everything runs on stock interpreters: nothing is pip- or npm-installed.
# All third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check-versions.sh

  # Unit, adversarial, compatibility, architecture and build tests. Tests that
  # need Postgres skip themselves here (LAZARET_TEST_PG_DSN is unset).
  python-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - working-directory: python
        run: python -m unittest discover -s tests -t . -v

  # Live Postgres. The password only exists inside this job's throwaway
  # container, so it is not a secret.
  python-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest (the multi-arch index of postgres:17 = 17.11). Resolved
        # 2026-09-25 from docker-library/repo-info (repos/postgres/remote/17.md),
        # which mirrors Docker Hub; Docker Hub itself was not reachable from the
        # machine that made this change. Verify or update with:
        #   docker buildx imagetools inspect postgres:17
        # Dependabot does not update service images: bump this by hand.
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: lazaret-ci
          POSTGRES_DB: lazaret_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      LAZARET_TEST_PG_DSN: postgresql://postgres:lazaret-ci@127.0.0.1:5432/lazaret_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - working-directory: python
        run: python -m unittest tests.pg.test_integration tests.registry.test_pg_backend -v

  js:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - working-directory: js
        run: npm test

  # The native engine (rust/, docs/RUST_ENGINE.md): no external crates, its
  # rule pack current with core, its own tests, and the differential tests
  # that hold it to the Python engine. Those skip themselves where the
  # library is not built, so this job builds it first; on Linux it then runs
  # the whole Python suite with the native engine answering. Rust is on the
  # runners already; the build needs no registry (Cargo.lock lists only the
  # workspace). Python 3.10 because make_rust_tables.py --check compares the
  # generated Unicode 13.0 tables with 3.10's unicodedata.
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python scripts/check_rust_deps.py
      - run: python scripts/make_rust_tables.py --check
      - working-directory: rust
        run: cargo test --release --offline --locked
      - working-directory: rust
        run: cargo build --release --offline --locked
      - name: The native engine against the Python engine
        working-directory: python
        shell: bash
        run: |
          export LAZARET_NATIVE_LIB="$(python -c "import os, sys; n = {'win32': 'lazaret_native.dll', 'darwin': 'liblazaret_native.dylib'}.get(sys.platform, 'liblazaret_native.so'); print(os.path.abspath(os.path.join('..', 'rust', 'target', 'release', n)))")"
          PYTHONPATH=src python -c "from lazaret.scanner import _native; assert _native.available(), _native.load_error(); print('native engine', _native.version())"
          python -m unittest tests.architecture.test_rust_parity_regex tests.architecture.test_rust_parity_hooks tests.architecture.test_rust_parity_signs -v
      - name: The whole suite, the native engine answering
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        shell: bash
        run: |
          export LAZARET_NATIVE_LIB="$(pwd)/../rust/target/release/liblazaret_native.so" LAZARET_ENGINE=rust
          python -m unittest discover -s tests -t .
