# The Python release's files: the sdist, which carries the native engine's
# sources (rust/, docs/RUST_ENGINE.md), and eight platform wheels, which
# carry the engine built (Linux with glibc and with musl, each on x86-64 and
# ARM64; macOS on Apple silicon and Intel; Windows on x64 and ARM64). Since
# the Rust-first refactor the package has no engine without it, so there is
# no pure (py3-none-any) wheel: where no platform wheel fits, pip builds one
# from the sdist, compiling the engine with cargo. Each platform's library
# is built, checked and tested on that platform, the nine files are built
# from one checkout, each platform wheel is installed with pip on its
# platform and run, and on Linux x86-64 pip installs the sdist too. release.yml calls this workflow and publishes what
# the `dist` job uploads (artifact python-dist). It also runs on pull
# requests and pushes to main that change what goes into a wheel, so a
# release never meets a platform build for the first time.
#
# Pins, bumped by hand (Dependabot updates the actions, not these):
# - RUST_VERSION: the compiler every library is built with, installed by the
#   runner's rustup, which checks each component against the SHA-256 sums
#   the Rust release publishes. Keep it at or above rust-version in
#   rust/Cargo.toml, and the same as release.yml's (the npm package's
#   WebAssembly build). 1.95.0 is the compiler of the measurements in
#   docs/RUST_ENGINE.md.
# - The manylinux_2_28 and musllinux_1_2 images, by digest (see the comments
#   at the matrices; the install job runs the musllinux ones again).
# The workspace has no external crates, so every build is --offline and
# --locked: nothing but the toolchain is downloaded.
name: Wheels

on:
  pull_request:
    paths:
      - "rust/**"
      - "python/_build/**"
      - "python/src/lazaret/__init__.py"
      - "python/src/lazaret/scanner/_native.py"
      - "python/src/lazaret/scanner/engine.py"
      - "scripts/check_native_library.py"
      - ".github/workflows/wheels.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "python/_build/**"
      - "python/src/lazaret/__init__.py"
      - "python/src/lazaret/scanner/_native.py"
      - "python/src/lazaret/scanner/engine.py"
      - "scripts/check_native_library.py"
      - ".github/workflows/wheels.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.95.0"

jobs:
  # The Linux libraries, built inside PyPA's manylinux_2_28 image of their
  # tag, so they need glibc 2.28 at most (a build on the runner itself would
  # need its glibc, 2.39). The runner installs the pinned toolchain; the
  # container gets it read-only and links with the image's gcc and glibc.
  # The check, the load and the Python suite then run inside the image too,
  # on its glibc 2.28 and its Python 3.12.
  linux:
    name: library (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned by digest; the tag in front is the dated tag PyPA published
          # it under, for reading only (the digest decides). Resolved
          # 2026-09-29 from quay.io's tag lists:
          #   https://quay.io/api/v1/repository/pypa/manylinux_2_28_x86_64/tag/?onlyActiveTags=true
          #   (and .../manylinux_2_28_aarch64/...). To update, take the newest
          #   dated tag's manifest_digest for both, or run
          #   docker buildx imagetools inspect quay.io/pypa/manylinux_2_28_x86_64:latest
          - tag: manylinux_2_28_x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.09.29-1@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
          - tag: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.09.29-1@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Build, check and test in the ${{ matrix.tag }} image
        env:
          TAG: ${{ matrix.tag }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          toolchain="$(rustc +"$RUST_VERSION" --print sysroot)"
          docker run --rm -v "$toolchain:/opt/rust:ro" -v "$GITHUB_WORKSPACE:/io" -w /io \
            -e TAG -e TARGET -e CARGO_HOME=/tmp/cargo-home "$IMAGE" bash -euo pipefail -c '
              export PATH="/opt/rust/bin:$PATH" RUSTFLAGS="-C linker=gcc"
              rustc --version && getconf GNU_LIBC_VERSION
              (cd rust && cargo build --release --offline --locked --target "$TARGET")
              lib="$PWD/rust/target/$TARGET/release/liblazaret_native.so"
              py=/opt/python/cp312-cp312/bin/python
              "$py" scripts/check_native_library.py "$lib" "$TAG" --load
              cd python
              LAZARET_NATIVE_LIB="$lib" "$py" -m unittest discover -s tests -t .'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.tag }}
          path: rust/target/${{ matrix.target }}/release/liblazaret_native.so
          if-no-files-found: error
          retention-days: 14

  # The musl libraries (Alpine and other musl systems), built inside PyPA's
  # musllinux_1_2 image of their tag, as the glibc ones are in theirs, and
  # checked, loaded and tested there on its musl and its Python 3.12. The
  # image runs a musl-hosted toolchain: the runner installs it (rustup checks
  # it against the release's SHA-256 sums, as any other) and the container
  # gets it read-only. Two flags make a library that a musl Python can load
  # and a minimal Alpine can run:
  # - -crt-static: musl's libc is linked dynamically, the process's own (a
  #   static one would be a second libc in the process);
  # - the unwinder is linked in: with a dynamic libc, Rust's standard library
  #   asks for libgcc_s, and a minimal Alpine has no libgcc. The toolchain's
  #   own libunwind.a, the unwinder a static musl build links, is offered to
  #   the linker as libgcc_s.a.
  # The check holds the library to musl's libc alone.
  musllinux:
    name: library (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned by digest, read as the manylinux images are; the install job
          # runs the same two, so a bump changes both. Resolved 2026-10-09 from
          # quay.io's tag lists:
          #   https://quay.io/api/v1/repository/pypa/musllinux_1_2_x86_64/tag/?onlyActiveTags=true
          #   (and .../musllinux_1_2_aarch64/...).
          - tag: musllinux_1_2_x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            image: quay.io/pypa/musllinux_1_2_x86_64:2026.10.09-1@sha256:dc96c1f69b8a6241bcc8175a8d89b1caf0dccf959ff111a2272c42747af38350
          - tag: musllinux_1_2_aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            image: quay.io/pypa/musllinux_1_2_aarch64:2026.10.09-1@sha256:83a69fa8383ba5ac2d4f01597b791ebf93269c9748270b51b7a54fbba0dcdd39
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_VERSION }}, musl-hosted
        env:
          TARGET: ${{ matrix.target }}
        # (--force-non-host: it runs in the image, not on the runner)
        run: rustup toolchain install "$RUST_VERSION-$TARGET" --profile minimal --force-non-host --no-self-update
      - name: Build, check and test in the ${{ matrix.tag }} image
        env:
          TAG: ${{ matrix.tag }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          toolchain="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/$RUST_VERSION-$TARGET"
          test -x "$toolchain/bin/cargo"
          docker run --rm -v "$toolchain:/opt/rust:ro" -v "$GITHUB_WORKSPACE:/io" -w /io \
            -e TAG -e TARGET -e CARGO_HOME=/tmp/cargo-home "$IMAGE" sh -euc '
              mkdir /tmp/unwind
              cp "/opt/rust/lib/rustlib/$TARGET/lib/self-contained/libunwind.a" /tmp/unwind/libgcc_s.a
              export PATH="/opt/rust/bin:$PATH"
              export RUSTFLAGS="-C target-feature=-crt-static -C linker=gcc -L native=/tmp/unwind"
              rustc --version && ldd --version 2>&1 | head -2
              (cd rust && cargo build --release --offline --locked --target "$TARGET")
              lib="$PWD/rust/target/$TARGET/release/liblazaret_native.so"
              py=/opt/python/cp312-cp312/bin/python
              "$py" scripts/check_native_library.py "$lib" "$TAG" --load
              cd python
              LAZARET_NATIVE_LIB="$lib" "$py" -m unittest discover -s tests -t .'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.tag }}
          path: rust/target/${{ matrix.target }}/release/liblazaret_native.so
          if-no-files-found: error
          retention-days: 14

  # macOS and Windows, each on a runner of its own architecture (the Intel
  # library on macos-15-intel, GitHub's last Intel image, available until
  # August 2027; after that it becomes a cross build on Apple silicon, checked
  # by its headers only; the ARM64 Windows DLL on windows-11-arm). The
  # deployment targets are the tags' minimums. The Windows DLLs link the C
  # runtime statically: machines without the Visual C++ redistributable can
  # load them.
  macos-windows:
    name: library (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: macosx_11_0_arm64
            runner: macos-15
            target: aarch64-apple-darwin
            library: liblazaret_native.dylib
            deployment-target: "11.0"
          - tag: macosx_10_12_x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            library: liblazaret_native.dylib
            deployment-target: "10.12"
          - tag: win_amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: lazaret_native.dll
            rustflags: -C target-feature=+crt-static
          - tag: win_arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            library: lazaret_native.dll
            rustflags: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ matrix.tag }}
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      LAZARET_NATIVE_LIB: ${{ github.workspace }}/rust/target/${{ matrix.target }}/release/${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET" --no-self-update
      - name: Build
        working-directory: rust
        run: cargo +"$RUST_VERSION" build --release --offline --locked --target "$TARGET"
      - name: Check it against its tag, and load it
        run: python scripts/check_native_library.py "$LAZARET_NATIVE_LIB" "$TAG" --load
      - name: The Python suite on this library (its recorded outputs among them)
        working-directory: python
        run: python -m unittest discover -s tests -t .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.tag }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.library }}
          if-no-files-found: error
          retention-days: 14

  # The six files, from one checkout, stamped with the commit's time. Each
  # platform wheel is the sdist's package files plus a library, which the
  # check holds it to, against its own tag.
  dist:
    name: sdist and wheels
    needs: [linux, musllinux, macos-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Exact version: the compressed bytes depend on the interpreter's
          # zlib, so rebuilding a tag byte-for-byte needs the same Python.
          python-version: "3.12.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native/
      - name: Build
        working-directory: python
        # Reproducible: stamped with the commit's time, so rebuilding the same
        # tag gives byte-identical artifacts (given the same libraries). The
        # backend refuses to build if anything outside its allowlist is in the
        # source tree.
        run: >-
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python _build/lazaret_build.py dist
          --platform manylinux_2_28_x86_64=../native/native-manylinux_2_28_x86_64/liblazaret_native.so
          --platform manylinux_2_28_aarch64=../native/native-manylinux_2_28_aarch64/liblazaret_native.so
          --platform musllinux_1_2_x86_64=../native/native-musllinux_1_2_x86_64/liblazaret_native.so
          --platform musllinux_1_2_aarch64=../native/native-musllinux_1_2_aarch64/liblazaret_native.so
          --platform macosx_11_0_arm64=../native/native-macosx_11_0_arm64/liblazaret_native.dylib
          --platform macosx_10_12_x86_64=../native/native-macosx_10_12_x86_64/liblazaret_native.dylib
          --platform win_amd64=../native/native-win_amd64/lazaret_native.dll
          --platform win_arm64=../native/native-win_arm64/lazaret_native.dll
      - name: The wheels against each other and their tags
        run: >-
          python scripts/check_native_library.py --dist python/dist
          --expect manylinux_2_28_x86_64 --expect manylinux_2_28_aarch64
          --expect musllinux_1_2_x86_64 --expect musllinux_1_2_aarch64
          --expect macosx_11_0_arm64 --expect macosx_10_12_x86_64 --expect win_amd64 --expect win_arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  # What a user gets: pip, given only these files, installs the platform
  # wheel on its platform, and it runs the native engine, at the package's
  # version. The musl wheels are installed in the musllinux images, with
  # their Python 3.12 (the runners' Pythons are glibc's, and pip would take a
  # manylinux wheel there). On Linux x86-64 pip also installs the sdist, as
  # it does on a platform without a platform wheel: it compiles the engine
  # (with the pinned toolchain) and the package runs it.
  install:
    name: install (${{ matrix.tag }})
    needs: dist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: manylinux_2_28_x86_64, runner: ubuntu-24.04 }
          - { tag: manylinux_2_28_aarch64, runner: ubuntu-24.04-arm }
          # the musllinux job's images
          - { tag: musllinux_1_2_x86_64, runner: ubuntu-24.04,
              image: quay.io/pypa/musllinux_1_2_x86_64:2026.10.09-1@sha256:dc96c1f69b8a6241bcc8175a8d89b1caf0dccf959ff111a2272c42747af38350 }
          - { tag: musllinux_1_2_aarch64, runner: ubuntu-24.04-arm,
              image: quay.io/pypa/musllinux_1_2_aarch64:2026.10.09-1@sha256:83a69fa8383ba5ac2d4f01597b791ebf93269c9748270b51b7a54fbba0dcdd39 }
          - { tag: macosx_11_0_arm64, runner: macos-15 }
          - { tag: macosx_10_12_x86_64, runner: macos-15-intel }
          - { tag: win_amd64, runner: windows-2025 }
          - { tag: win_arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.image }}
        with:
          python-version: "3.12"
      - name: pip installs the ${{ matrix.tag }} wheel, and it runs the native engine
        if: ${{ !matrix.image }}
        run: |
          python -m venv venv
          if [ -x venv/bin/python ]; then py=venv/bin/python; else py=venv/Scripts/python.exe; fi
          "$py" -m pip install --no-index --find-links dist --only-binary :all: lazaret
          "$py" -c '
          import importlib.metadata, os, subprocess, sys
          from lazaret import __version__ as v
          wheel = importlib.metadata.distribution("lazaret").read_text("WHEEL")
          assert "Tag: py3-none-" + os.environ["TAG"] + "\n" in wheel, wheel
          out = subprocess.run([sys.executable, "-m", "lazaret", "--version"], capture_output=True, text=True,
                               check=True).stdout.strip()
          assert out == f"lazaret {v} (engine: rust {v})", out
          print(out)
          '
      - name: pip installs the ${{ matrix.tag }} wheel in its image, and it runs the native engine
        if: ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          cat > installed.py <<'EOF'
          import importlib.metadata, os, subprocess, sys
          from lazaret import __version__ as v
          wheel = importlib.metadata.distribution("lazaret").read_text("WHEEL")
          assert "Tag: py3-none-" + os.environ["TAG"] + "\n" in wheel, wheel
          out = subprocess.run([sys.executable, "-m", "lazaret", "--version"], capture_output=True, text=True,
                               check=True).stdout.strip()
          assert out == f"lazaret {v} (engine: rust {v})", out
          print(out)
          EOF
          docker run --rm -v "$PWD:/w:ro" -w /w -e TAG "$IMAGE" sh -euc '
            /opt/python/cp312-cp312/bin/python -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --no-index --find-links dist --only-binary :all: lazaret
            /tmp/venv/bin/python installed.py'
      - name: Rust ${{ env.RUST_VERSION }}, for the sdist
        if: matrix.tag == 'manylinux_2_28_x86_64'
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: pip builds the sdist, compiling the engine, and it runs
        if: matrix.tag == 'manylinux_2_28_x86_64'
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          python -m venv from-source
          from-source/bin/python -m pip install --no-index dist/lazaret-*.tar.gz
          from-source/bin/python -c '
          import importlib.metadata, subprocess, sys
          from lazaret import __version__ as v
          wheel = importlib.metadata.distribution("lazaret").read_text("WHEEL")
          assert "Tag: py3-none-linux_x86_64\n" in wheel, wheel
          out = subprocess.run([sys.executable, "-m", "lazaret", "--version"], capture_output=True, text=True,
                               check=True).stdout.strip()
          assert out == f"lazaret {v} (engine: rust {v})", out
          print(out)
          '
