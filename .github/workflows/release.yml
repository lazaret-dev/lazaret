# Publishes both packages when a v* tag is pushed.
# The Python artifacts are built by Lazaret's own stdlib backend: no build
# tools are installed. Publishing uses trusted publishing (OIDC): no registry
# tokens are stored in GitHub. Each publish job runs in its own environment;
# add required reviewers to the "pypi" and "npm" environments so nothing ships
# without your approval.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - working-directory: python
        # Reproducible: stamped with the tagged commit's time, so rebuilding
        # the same tag gives byte-identical artifacts.
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python _build/lazaret_build.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lazaret/
    permissions:
      id-token: write   # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/lazaret
    permissions:
      id-token: write   # trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@11   # trusted publishing needs npm >= 11.5.1; staged publishing >= 11.15.0
      - working-directory: js
        # Stage only. The npm trusted publisher allows `npm stage publish` and
        # nothing else, so this version stays hidden until a maintainer
        # approves it with 2FA: npmjs.com -> lazaret -> Staged Packages, or
        # `npm stage approve <stage-id>`.
        run: npm stage publish
      - name: Approval reminder
        run: >-
          echo "lazaret ${GITHUB_REF_NAME} is staged on npm, not yet public. Approve it with 2FA at
          https://www.npmjs.com/package/lazaret (Staged Packages) or with npm stage approve." >> "$GITHUB_STEP_SUMMARY"
