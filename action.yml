# Lazaret as a GitHub Action: scan the checked-out project and write a
# SARIF 2.1.0 report for GitHub code scanning (README.md, "In CI").
#
#   - uses: lazaret-dev/lazaret@<full commit SHA> # v0.1.9
#     id: lazaret
#   - uses: github/codeql-action/upload-sarif@<full commit SHA> # v…
#     if: ${{ !cancelled() }}
#     with:
#       sarif_file: ${{ steps.lazaret.outputs.sarif }}
#
# It installs Lazaret from this action's own files, the commit you pin, and
# compiles the native engine with the runner's cargo (GitHub's hosted
# runners have Rust; a self-hosted runner needs it, rust-version in
# rust/Cargo.toml or later): what runs is that commit's code, not a package
# fetched by its version number, which a registry could be made to serve
# differently. Nothing is downloaded: the engine has no external crates and
# the install uses no package index. It takes a minute or two.
#
# Nothing of the repository it scans runs in it (F-01): `python -m` puts
# the current directory first on sys.path, and a step starts in the
# checkout, so a pull request's venv.py, pip.py, lazaret.py or
# sitecustomize.py, or a workflow's PYTHONPATH, would run in its place.
# Each step's shell starts without BASH_ENV and ENV. The step drops a
# function of the environment's named as a command it runs, every PYTHON*
# (and in the install step PIP_*) variable, Lazaret's native-library
# overrides (LAZARET_NATIVE_LIB, LAZARET_NATIVE_LIBRARY,
# LAZARET_WHEEL_PLATFORM: they are for development) and every Rust
# variable that picks a tool or adds flags (CARGO_HOME and RUSTUP_HOME,
# which find the toolchain, are kept, and refused in the workspace), and
# runs from $RUNNER_TEMP. python3 and cargo are taken by their absolute
# path from PATH and refused when they are in the workspace (a tool cache
# installed there too, on purpose); the build gets PATH without the
# workspace's folders. Every interpreter runs with -I
# (no current or script directory, PYTHON* variable or user site directory
# on its path), pip with --isolated and no configuration file
# (PIP_CONFIG_FILE is the null device). The scan's path is made absolute
# from the workspace. The rest of the environment is the workflow's: it
# must not come from the checkout (README.md, "In CI").
#
# Inputs reach the scripts through the environment, never spliced into
# them, so a value can't run as shell.
name: Lazaret
description: Security, supply-chain and quality analysis for Python and JavaScript, with a SARIF report for code scanning.
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: The directory to scan, relative to the workspace.
    required: false
    default: "."
  sarif:
    description: Where to write the SARIF report; a relative path is under the scanned directory, as with the CLI's --sarif.
    required: false
    default: lazaret.sarif
  gate:
    description: "true: the step fails when Lazaret's quality gate fails (--ci). The report is written either way."
    required: false
    default: "true"
  deps:
    description: "true: also audit the installed dependencies (node_modules, a virtual environment) for supply-chain indicators (--deps)."
    required: false
    default: "false"
outputs:
  sarif:
    description: The SARIF report's path, for github/codeql-action/upload-sarif.
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - name: Install Lazaret from this action's commit (compiles the engine)
      shell: env -u BASH_ENV -u ENV bash --noprofile --norc -eo pipefail {0}
      run: |
        set -euo pipefail
        # F-01: nothing of the checkout runs here (action.yml's header). The shell started without
        # BASH_ENV and ENV; a function of the environment's named as a command run here is dropped, and
        # so is every PYTHON* and PIP_* variable, native-library override and Rust tool or flag variable
        # (in any case: Windows reads them so), but CARGO_HOME and RUSTUP_HOME
        unset -f python3 python cargo command cd pwd printf echo readlink read shopt '['
        shopt -s nocasematch
        for name in "${!P@}" "${!p@}" "${!L@}" "${!l@}" "${!C@}" "${!c@}" "${!R@}" "${!r@}"; do
          case "$name" in
            PYTHON*|PIP_*|LAZARET_NATIVE_LIB|LAZARET_NATIVE_LIBRARY|LAZARET_WHEEL_PLATFORM|CARGO|CARGO_*|RUST*)
              [ "$name" = CARGO_HOME ] || [ "$name" = RUSTUP_HOME ] || unset -v "$name" ;;
          esac
        done
        shopt -u nocasematch
        cd "$RUNNER_TEMP"
        ws="$(cd -P -- "$GITHUB_WORKSPACE" && pwd -P)"
        inside() { case "$1/" in "$ws"/*) return 0 ;; esac; return 1; }
        for home in "$RUNNER_TEMP" "${CARGO_HOME:-}" "${RUSTUP_HOME:-}"; do
          if [ -n "$home" ] && [ -d "$home" ] && inside "$(cd -P -- "$home" && pwd -P)"; then
            echo "::error::$home is in the workspace: refused" >&2; exit 2
          fi
        done
        # a command's absolute path on PATH, refused when it, or what its symlinks lead to, is in the workspace
        trusted() {
          local p t n=0
          p="$(command -v -- "$1")" || return 1
          case "$p" in /*) ;; *) echo "::error::$1 on PATH is not an absolute path ($p): refused" >&2; return 2 ;; esac
          t="$p"
          while [ -L "$t" ] && [ "$n" -lt 40 ]; do
            n=$((n + 1)); set -- "$1" "$(readlink -- "$t")"
            [ -n "$2" ] || break
            case "$2" in /*) t="$2" ;; *) t="${t%/*}/$2" ;; esac
          done
          for t in "${p%/*}" "${t%/*}"; do
            if ! t="$(cd -P -- "$t" && pwd -P)" || inside "$t"; then
              echo "::error::$1 on PATH is in the workspace ($p): refused" >&2; return 2
            fi
          done
          printf '%s\n' "$p"
        }
        name=python3; command -v python3 >/dev/null 2>&1 || name=python
        python="$(trusted "$name")" || { [ $? -eq 2 ] || echo "::error::no python3 or python on PATH" >&2; exit 2; }
        if command -v cargo >/dev/null 2>&1; then CARGO="$(trusted cargo)"; export CARGO; fi
        # the build's own tools (rustc's linker) from PATH without the current folder or the workspace's
        kept=""
        IFS=: read -r -a entries <<< "$PATH"
        for d in "${entries[@]}"; do
          case "$d" in /*) ;; *) continue ;; esac
          if real="$(cd -P -- "$d" 2>/dev/null && pwd -P)" && ! inside "$real"; then kept="${kept:+$kept:}$d"; fi
        done
        export PATH="$kept"
        "$python" -I -m venv "$RUNNER_TEMP/lazaret-action"
        venv="$RUNNER_TEMP/lazaret-action/bin/python"
        [ -x "$venv" ] || venv="$RUNNER_TEMP/lazaret-action/Scripts/python.exe"
        # no pip configuration file at all (pip reads none when PIP_CONFIG_FILE is the null device)
        PIP_CONFIG_FILE="$("$venv" -I -c 'import os, sys; sys.stdout.write(os.devnull)')" \
          "$venv" -I -m pip install --isolated --no-index --disable-pip-version-check "$GITHUB_ACTION_PATH/python"
    - name: Scan
      id: scan
      shell: env -u BASH_ENV -u ENV bash --noprofile --norc -eo pipefail {0}
      env:
        SCAN_PATH: ${{ inputs.path }}
        SARIF_PATH: ${{ inputs.sarif }}
        GATE: ${{ inputs.gate }}
        DEPS: ${{ inputs.deps }}
      run: |
        set -euo pipefail
        # F-01: isolated from the checkout, as the install step is; the interpreter is the venv's, by its path
        unset -f cd echo shopt '['
        shopt -s nocasematch
        for name in "${!P@}" "${!p@}" "${!L@}" "${!l@}" "${!C@}" "${!c@}" "${!R@}" "${!r@}"; do
          case "$name" in
            PYTHON*|LAZARET_NATIVE_LIB|LAZARET_NATIVE_LIBRARY|LAZARET_WHEEL_PLATFORM|CARGO|CARGO_*|RUST*)
              [ "$name" = CARGO_HOME ] || [ "$name" = RUSTUP_HOME ] || unset -v "$name" ;;
          esac
        done
        shopt -u nocasematch
        cd "$RUNNER_TEMP"
        venv="$RUNNER_TEMP/lazaret-action/bin/python"
        [ -x "$venv" ] || venv="$RUNNER_TEMP/lazaret-action/Scripts/python.exe"
        # the directory to scan: a relative one is the workspace's (the step runs in $RUNNER_TEMP)
        case "$SCAN_PATH" in
          ''|/*|\\*|[A-Za-z]:[\\/]*) target="$SCAN_PATH" ;;
          .) target="$GITHUB_WORKSPACE" ;;
          *) target="${GITHUB_WORKSPACE%/}/$SCAN_PATH" ;;
        esac
        args=(-I -m lazaret "$target" --sarif "$SARIF_PATH" --no-html --no-json)
        case "$GATE" in true) args+=(--ci) ;; false) ;; *) echo "::error::gate must be true or false" >&2; exit 2 ;; esac
        case "$DEPS" in true) args+=(--deps) ;; false) ;; *) echo "::error::deps must be true or false" >&2; exit 2 ;; esac
        case "$SARIF_PATH" in
          /*|\\*|[A-Za-z]:*) report="$SARIF_PATH" ;;
          *) report="${SCAN_PATH%/}/$SARIF_PATH" ;;
        esac
        case "$report" in
          *$'\n'*|*$'\r'*) echo "::error::path and sarif must be one line each" >&2; exit 2 ;;
        esac
        echo "sarif=$report" >> "$GITHUB_OUTPUT"
        "$venv" "${args[@]}"
