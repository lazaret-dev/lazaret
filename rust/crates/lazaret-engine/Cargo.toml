[package]
name = "lazaret-engine"
description = "Lazaret's scanning engine: bytes in, findings out (no I/O, no unsafe; one dependency, lazaret-verify, tiny_https's pure part)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
# per-pattern timing for the profiling examples; never in a release build
stats = []

[dependencies]
# tiny_https's pure part (no I/O, no unsafe; scripts/check_rust_deps.py holds the line): SHA-256, for the signed
# requests of live secret verification (secrets.rs)
lazaret-verify = { path = "../lazaret-verify" }
