[package]
name = "lazaret-ffi"
description = "C ABI over lazaret-engine (and, natively, lazaret-net): loaded by Python's ctypes and, as WebAssembly, by Node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "lazaret_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
lazaret-engine = { path = "../lazaret-engine" }

# The network layer (NET-1), in the native library only: the WebAssembly build has no sockets, and the engine
# itself never links it (scripts/check_rust_deps.py).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lazaret-net = { path = "../lazaret-net" }
# pratique's pure verification part, for the calls the native library answers itself (`verify.*`: the Go checksum
# database's records); the WebAssembly build has no use for it yet
lazaret-verify = { path = "../lazaret-verify" }
